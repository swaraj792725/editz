[project]
name = "editz-worker"
version = "0.1.0"
description = "Editz local AI worker: speech to text (Whisper via MLX), voice-over (Kokoro), vision tags and search (SigLIP 2). JSON lines over stdio."
requires-python = ">=3.10,<3.14"
dependencies = [
  "mlx-whisper>=0.4.2; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "kokoro-onnx>=0.4.9",
  "numpy",
  "tokenizers>=0.20",
  "pillow>=10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["editz_worker"]

[tool.uv]
# mlx-whisper lists torch only for its model-conversion script; runtime never imports it (saves ~600 MB).
override-dependencies = ["torch; sys_platform == 'never'"]
